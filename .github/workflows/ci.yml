name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e ".[dev,doc]"
      - name: pytest
        run: pytest tests -q

  package:
    name: package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheel
        run: |
          pip install build "twine>=7.0.0"
          python -m build
          twine check --strict dist/*
      - name: install wheel + smoke
        run: |
          python -m venv /tmp/pifang-wheel
          /tmp/pifang-wheel/bin/pip install dist/*.whl
          /tmp/pifang-wheel/bin/pifang --json version
          /tmp/pifang-wheel/bin/pifang --json doctor

  media-optional:
    name: media optional (ffmpeg + transcribe)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: install
        run: pip install -e ".[dev,doc,transcribe]"
      - name: pytest media
        run: pytest tests/test_video.py tests/test_transcribe.py -q
