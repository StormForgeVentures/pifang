[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pifang"
version = "0.1.0"
description = "Agent-first CLI for deterministic image, document, and media processing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "StormForge Ventures", email = "hello@stormforgeventures.com" }]
keywords = ["cli", "image", "ffmpeg", "pdf", "agents", "batch", "whisper", "transcription"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # License via SPDX project.license = "Apache-2.0" (no redundant License :: classifier)
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pillow>=10.4.0",
  "typer>=0.12.0",
  # Explicit: main.py imports click for Exit/UsageError JSON wrapping.
  # Typer ≥0.27 vendors click and no longer pulls it as a runtime dep.
  "click>=8.0.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Pure-Python doc path (default engine: fast / pymupdf4llm)
doc = ["pymupdf4llm>=0.0.20", "pypdf>=5.0.0"]
# Optional Java-backed OpenDataLoader — only if you explicitly need it
doc-odl = ["opendataloader-pdf>=1.0.0"]
doc-heavy = ["docling>=2.0.0", "marker-pdf>=1.0.0"]
video = []  # marker extra — requires system ffmpeg/ffprobe
transcribe = ["faster-whisper>=1.0.0"]
fast = ["pyvips>=2.2.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pymupdf4llm>=0.0.20", "pypdf>=5.0.0", "build>=1.2.0", "twine>=7.0.0"]

[project.scripts]
pifang = "pifang.cli.main:run"

[project.urls]
Homepage = "https://github.com/StormForgeVentures/pifang"
Repository = "https://github.com/StormForgeVentures/pifang"
Issues = "https://github.com/StormForgeVentures/pifang/issues"
Changelog = "https://github.com/StormForgeVentures/pifang/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pifang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src/pifang",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "docs/project-brief.md",
  "docs/glossary.md",
  "docs/agents-blurb.md",
  "docs/out-of-scope.md",
  "docs/pkg-classification.md",
  "docs/api-design.md",
  "examples",
  "skills",
  "tests",
  "pyproject.toml",
]
exclude = [
  "docs/tasks",
  "docs/archive",
  "docs/publishing.md",
  "handoff",
  ".claude",
  ".roster",
]
