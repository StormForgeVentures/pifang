name: hero
domain: image
description: Cover resize to dimensions, compress to max KB
params:
  width:
    type: int
    default: 1920
  height:
    type: int
    default: 1080
  max_kb:
    type: int
    default: 400
steps:
  - resize:
      width: "{{ width }}"
      height: "{{ height }}"
      fit: cover
  - compress:
      max_kb: "{{ max_kb }}"
      quality: 85
